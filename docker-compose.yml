services:
  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
      - "50051:50051"
    depends_on:
      - auth-service
      - game-store-service
      - consul
    environment:
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      
  auth-service:
    build: ./auth-service
    depends_on:
      - auth-db
    env_file:
      - ./auth-service/.env  
    deploy:
      replicas: 3
      
  auth-db:
    image: postgres:16
    env_file:
      - ./auth-service/.env
    ports:
      - "5433:5432"
    volumes:
      - ./auth-service/src/db:/docker-entrypoint-initdb.d  

  game-store-service:
    build: ./game-store-service
    depends_on:
      - game-db
      - redis
    env_file:
      - ./game-store-service/.env    
    deploy:
      replicas: 3 

  # game-store-service-1:
  #   build: ./game-store-service
  #   depends_on:
  #     - game-db
  #     - redis
  #   env_file:
  #     - ./game-store-service/.env    
  #   ports:
  #     - "5001:5001"    

  game-db:
    image: postgres:16
    env_file:
      - ./game-store-service/.env
    volumes:
      - ./game-store-service/src/db:/docker-entrypoint-initdb.d 

  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'  

  consul:
    build:
      context: ./service-discovery
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"    
